  <body>
    <script>
      // Apply theme preference from localStorage immediately to prevent flash
      (function() {
        try {
          const savedTheme = localStorage.getItem("app-theme");
          const root = document.documentElement;
          
          if (savedTheme === "light") {
            root.classList.remove("dark");
          } else if (savedTheme === "dark") {
            root.classList.add("dark");
          } else if (savedTheme === "system") {
            // Follow system preference when explicitly set to "system"
            if (
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches
            ) {
              root.classList.add("dark");
            } else {
              root.classList.remove("dark");
            }
          } else {
            // Default to dark mode when no preference is saved
            root.classList.add("dark");
          }
        } catch (error) {
          // Fallback to dark mode if localStorage fails
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
