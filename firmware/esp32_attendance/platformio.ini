; PlatformIO Project Configuration File
; ESP32 Sui Attendance System

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Library dependencies
lib_deps = 
	miguelbalboa/MFRC522@^1.4.10
	bblanchon/ArduinoJson@^7.0.4

; Build flags
build_flags = 
	-Iinclude
	-O2
	-ffunction-sections
	-fdata-sections

; Upload settings
upload_speed = 921600