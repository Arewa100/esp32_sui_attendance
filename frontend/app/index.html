<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sui Attendance System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <script>
      // Apply theme preference from localStorage immediately to prevent flash
      (function() {
        try {
          const savedTheme = localStorage.getItem("app-theme");
          const root = document.documentElement;
          
          if (savedTheme === "light") {
            root.classList.remove("dark");
          } else if (savedTheme === "dark") {
            root.classList.add("dark");
          } else if (savedTheme === "system") {
            // Follow system preference when explicitly set to "system"
            if (
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches
            ) {
              root.classList.add("dark");
            } else {
              root.classList.remove("dark");
            }
          } else {
            // Default to dark mode when no preference is saved
            root.classList.add("dark");
          }
        } catch (error) {
          // Fallback to dark mode if localStorage fails
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
