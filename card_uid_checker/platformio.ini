; PlatformIO Project Configuration File
; ESP32 RFID Card UID Checker

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Library dependencies
lib_deps = 
	miguelbalboa/MFRC522@^1.4.10

; Build flags
build_flags = 
	-O2
	-ffunction-sections
	-fdata-sections

; Upload settings
upload_speed = 921600

; Fix for Windows build directory issues
build_dir = .pio/build

